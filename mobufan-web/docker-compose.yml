services:
  mobufan:
    image: mobufan:latest
    container_name: mobufan
    restart: unless-stopped
    privileged: true
    network_mode: host
    pid: host
    environment:
      # 访问令牌，留空则容器启动时自动生成并打印到日志
      MOBUFAN_TOKEN: "admin888"
    volumes:
      # 管理宿主机 Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # 只读访问宿主机文件系统（供后续扩展）
      - /:/host:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
